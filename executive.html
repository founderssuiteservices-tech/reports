<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Executive dashboard</title>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--card:#fff;--label:#1d1d1f;--label2:#6e6e73;--sep2:rgba(60,60,67,.26);--tint:#007aff;--red-ink:#d70015;--font:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--label:#f5f5f7;--label2:#98989d;--sep2:rgba(84,84,88,.65);--tint:#0a84ff;--red-ink:#ff6961}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg)}
.gbox{width:100%;max-width:340px;text-align:center}
.glock{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--label);box-shadow:0 0 0 .5px var(--sep2)}
.gbox h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:.007em;margin:0 0 8px}
.gbox p{margin:0 0 26px;color:var(--label2);font-size:15px}
.gfield{position:relative;display:flex;align-items:center;height:50px;border-radius:25px;background:var(--card);box-shadow:0 0 0 .5px var(--sep2);transition:box-shadow .2s}
.gfield:focus-within{box-shadow:0 0 0 .5px var(--sep2),0 0 0 4px color-mix(in srgb,var(--tint) 28%,transparent)}
.gfield input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;padding:0 56px 0 22px;font-size:17px;letter-spacing:-.02em}
.gfield input::placeholder{color:var(--label2)}
.garrow{position:absolute;right:7px;width:36px;height:36px;border-radius:50%;border:0;background:var(--tint);color:#fff;display:grid;place-items:center;cursor:pointer;transition:opacity .2s,transform .2s var(--ease)}
.garrow:active{transform:scale(.92)}.busy .garrow{opacity:.5}
.gerr{min-height:20px;margin:12px 0 0!important;color:var(--red-ink)!important;font-size:13px!important}
.gfine{margin:8px 0 0!important;font-size:12px!important}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
<script>try{const t=localStorage.getItem("ct.theme");document.documentElement.dataset.theme=t?JSON.parse(t):matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch{}</script>
</head>

const $ = id => document.getElementById(id), b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(code) {  // the page, or a throw for a wrong code
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256"}, km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(ENC.iv)}, key, b64(ENC.ct)));
}
const show = html => { document.open(); document.write(html); document.close(); };
const gate = () => { $("gate").hidden = false; setTimeout(() => $("gcode").focus(), 60); };
let kept = null; try { kept = sessionStorage.getItem("cci-code"); } catch {}  // the Tally page's key: one code opens both in this tab
if (kept) open_(kept).then(show, gate); else gate();
$("gform").onsubmit = async e => {
  e.preventDefault(); const code = $("gcode").value.trim(), f = $("gform"); if (!code || f.classList.contains("busy")) return;
  f.classList.add("busy"); $("gerr").textContent = ""; let html = null;
  try { html = await open_(code); } catch { $("gerr").textContent = "Incorrect code. Try again."; const g = $("gfield"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake"); $("gcode").select(); }
  f.classList.remove("busy");
  if (html) { try { sessionStorage.setItem("cci-code", code); } catch {} show(html); }
};
